# docker-compose.yml (network_mode: "host" を使用する構成)

version: '3.8'

services:
  # --- フロントエンドサービス ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue_mediapipe_frontend
    # network_mode: "host" を使用するため、ports設定は不要
    network_mode: "host"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  # --- バックエンドサービス ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicgen_backend
    # こちらも network_mode: "host" を使用するため、ports設定は不要
    network_mode: "host"
    volumes:
      - ./backend:/app
    # GPUを利用するための設定
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]